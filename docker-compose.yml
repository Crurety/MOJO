services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    ports:
      - "8000:8000"
    environment: &backend-env
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ai_platform}:${MYSQL_PASSWORD:-change_this_password}@mysql:3306/ai_platform
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_random_long_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      ADMIN_INIT_EMAIL: ${ADMIN_INIT_EMAIL:-}
      ADMIN_INIT_NICKNAME: ${ADMIN_INIT_NICKNAME:-Administrator}
    depends_on: &backend-depends
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - ai-platform-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_USER: ${MYSQL_USER:-ai_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_this_password}
      MYSQL_DATABASE: ai_platform
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ai-platform-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - ai-platform-network
    restart: unless-stopped

  mongodb:
    image: mongo:5
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - ai-platform-network
    restart: unless-stopped

  celery-worker-default:
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    command: celery -A app.tasks.celery_app worker -Q default -l info -n worker1@%h
    environment: *backend-env
    depends_on: *backend-depends
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-platform-network
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-worker-cleanup:
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    command: celery -A app.tasks.celery_app worker -Q cleanup -l info -n worker2@%h
    environment: *backend-env
    depends_on: *backend-depends
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-platform-network
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-worker-notification:
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    command: celery -A app.tasks.celery_app worker -Q notification -l info -n worker3@%h
    environment: *backend-env
    depends_on: *backend-depends
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-platform-network
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-worker-operation:
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    command: celery -A app.tasks.celery_app worker -Q operation -l info -n worker4@%h
    environment: *backend-env
    depends_on: *backend-depends
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-platform-network
    restart: unless-stopped
    healthcheck:
      disable: true

  celery-beat:
    image: mojo-backend:${MOJO_IMAGE_TAG:-local}
    command: celery -A app.tasks.celery_app beat -l info
    environment: *backend-env
    depends_on: *backend-depends
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - ai-platform-network
    restart: unless-stopped
    healthcheck:
      disable: true

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./frontend/dist:/usr/share/nginx/html
      - ./admin/dist:/usr/share/nginx/admin
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-platform-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  mongodb-data:

networks:
  ai-platform-network:
    driver: bridge
