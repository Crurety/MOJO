name = "mojo-api"
main = "src/index.ts"
compatibility_date = "2026-03-10"

[vars]
API_PREFIX = "/api/v1"
OPENAI_API_BASE = "https://codeproxy.dev/v1"
OPENAI_MODEL = "gpt-5.2"
OPENAI_API_WIRE = "responses"
OPENAI_REASONING_EFFORT = "medium"
OPENAI_DISABLE_RESPONSE_STORAGE = "true"
DEEPSEEK_API_BASE = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
STABILITY_API_BASE = "https://api.stability.ai/v1"
STABILITY_ENGINE = "stable-diffusion-xl-1024-v1-0"
RUNWAY_API_BASE = "https://api.runwayml.com/v1"
ASSET_PUBLIC_BASE = "https://mojo-api.c15797901189.workers.dev/assets"

[[d1_databases]]
binding = "DB"
database_name = "mojo-prod"
database_id = "7cb44fec-8a3b-496e-b96d-fbbae1cb8843"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "mojo-assets"

[[queues.producers]]
binding = "TASK_QUEUE"
queue = "mojo-tasks"

[[queues.consumers]]
queue = "mojo-tasks"
max_batch_size = 5
max_batch_timeout = 30
