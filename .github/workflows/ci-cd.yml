# CI/CD Pipeline - GitHub Actions
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  PROD_HOST: ${{ secrets.PROD_HOST }}
  PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
  PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
  PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

jobs:
  # Code lint checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install flake8 black isort

      - name: Run flake8
        run: |
          cd backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run black check (non-blocking)
        continue-on-error: true
        run: |
          cd backend
          black --check app

      - name: Run isort check (non-blocking)
        continue-on-error: true
        run: |
          cd backend
          isort --check-only app

  # Backend tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://root:test_password@localhost:3306/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  # Frontend checks
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Run build check
        run: |
          cd frontend
          npm run build

      - name: Run tests (if configured)
        run: |
          cd frontend
          if node -e "const s=require('./package.json').scripts || {}; process.exit(s.test ? 0 : 1)"; then
            npm run test
          else
            echo "No frontend test script found, skipping."
          fi

  # Build and push Docker images
  build:
    needs: [lint, backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push backend (sha)
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-backend:${{ github.sha }}

      - name: Build and push backend (latest)
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-backend:latest

      - name: Build backend image only (no push)
        if: ${{ env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build and push nginx (sha)
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-nginx:${{ github.sha }}

      - name: Build and push nginx (latest)
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-nginx:latest

      - name: Build nginx image only (no push)
        if: ${{ env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  # Deploy to production
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - if: ${{ env.PROD_HOST != '' && env.PROD_USERNAME != '' && (env.PROD_SSH_KEY != '' || env.PROD_PASSWORD != '') }}
        uses: actions/checkout@v3

      - name: Deploy to production
        if: ${{ env.PROD_HOST != '' && env.PROD_USERNAME != '' && (env.PROD_SSH_KEY != '' || env.PROD_PASSWORD != '') }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          password: ${{ secrets.PROD_PASSWORD }}
          command_timeout: 45m
          script: |
            set -e
            APP_DIR=/opt/ai-platform
            REPO_URL=https://github.com/Crurety/MOJO.git
            BRANCH=main
            MAX_RETRIES=5

            retry_cmd() {
              n=1
              until [ "$n" -gt "$MAX_RETRIES" ]; do
                "$@" && return 0
                echo "Command failed (attempt $n/$MAX_RETRIES): $*"
                n=$((n + 1))
                sleep 5
              done
              return 1
            }

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              retry_cmd git clone --depth 1 -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            if retry_cmd git fetch origin "$BRANCH"; then
              git checkout "$BRANCH"
              retry_cmd git pull --ff-only origin "$BRANCH"
            else
              echo "Warning: git fetch failed after retries, continue with local code in $APP_DIR"
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Docker Compose is not available on server"
              exit 1
            fi

            $DC pull || true
            $DC down --remove-orphans || true
            STALE_IDS=$(docker ps -aq --filter "name=_ai-platform-")
            if [ -n "$STALE_IDS" ]; then
              docker rm -f $STALE_IDS || true
            fi

            if ! $DC up -d --build --force-recreate --remove-orphans; then
              CONFLICT_IDS=$(docker ps -q --filter "publish=8000")
              if [ -n "$CONFLICT_IDS" ]; then
                docker stop $CONFLICT_IDS || true
                docker rm $CONFLICT_IDS || true
              fi
              $DC up -d --build --force-recreate --remove-orphans
            fi
            $DC exec -T backend alembic upgrade head
