# CI/CD Pipeline - GitHub Actions
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  PROD_HOST: ${{ secrets.PROD_HOST }}
  PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
  PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

jobs:
  # Code lint checks
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install flake8 black isort

      - name: Run flake8
        run: |
          cd backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run black check (non-blocking)
        continue-on-error: true
        run: |
          cd backend
          black --check app

      - name: Run isort check (non-blocking)
        continue-on-error: true
        run: |
          cd backend
          isort --check-only app

  # Backend tests
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://root:test_password@localhost:3306/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend

  # Frontend checks
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Run build check
        run: |
          cd frontend
          npm run build

      - name: Run tests (if configured)
        run: |
          cd frontend
          if node -e "const s=require('./package.json').scripts || {}; process.exit(s.test ? 0 : 1)"; then
            npm run test
          else
            echo "No frontend test script found, skipping."
          fi

  # Build and push Docker images
  build:
    needs: [lint, backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push backend (sha)
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-backend:${{ github.sha }}

      - name: Build and push backend (latest)
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-backend:latest

      - name: Build backend image only (no push)
        if: ${{ env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build and push nginx (sha)
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-nginx:${{ github.sha }}

      - name: Build and push nginx (latest)
        if: github.ref == 'refs/heads/main' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/ai-platform-nginx:latest

      - name: Build nginx image only (no push)
        if: ${{ env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == '' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  # Deploy to production
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - if: ${{ env.PROD_HOST != '' && env.PROD_USERNAME != '' && env.PROD_SSH_KEY != '' }}
        uses: actions/checkout@v3

      - name: Deploy to production
        if: ${{ env.PROD_HOST != '' && env.PROD_USERNAME != '' && env.PROD_SSH_KEY != '' }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/ai-platform
            docker-compose pull
            docker-compose up -d
            docker-compose exec -T backend alembic upgrade head
