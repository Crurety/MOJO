name: Mojo CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojo-ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"
  PROD_HOST: ${{ secrets.PROD_HOST }}
  PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
  PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
  PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
  PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/test_db
      REDIS_URL: redis://127.0.0.1:6379/0
      MONGODB_URL: mongodb://127.0.0.1:27017
      SECRET_KEY: test_secret_key
      TESTING: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run black check (non-blocking)
        continue-on-error: true
        run: black --check app

      - name: Run isort check (non-blocking)
        continue-on-error: true
        run: isort --check-only app

      - name: Run pytest
        run: pytest tests -v --cov=app --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: backend/coverage.xml
          if-no-files-found: warn

  web-ci:
    name: Web CI (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  deploy:
    name: Deploy
    needs: [backend-ci, web-ci]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to production server
        if: ${{ env.PROD_HOST != '' && env.PROD_USERNAME != '' && (env.PROD_SSH_KEY != '' || env.PROD_PASSWORD != '') }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          password: ${{ secrets.PROD_PASSWORD }}
          command_timeout: 60m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/mojo"
            fi

            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"
            COMMIT_SHA="${{ github.sha }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --depth 1 -b "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --depth 1 origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd
            git checkout --detach "$COMMIT_SHA"

            chmod +x scripts/deploy/remote-deploy.sh
            APP_DIR="$APP_DIR" COMMIT_SHA="$COMMIT_SHA" COMPOSE_PROJECT_NAME="mojo" bash scripts/deploy/remote-deploy.sh

      - name: Skip deploy (missing secrets)
        if: ${{ env.PROD_HOST == '' || env.PROD_USERNAME == '' || (env.PROD_SSH_KEY == '' && env.PROD_PASSWORD == '') }}
        run: |
          echo "Deployment skipped: production SSH secrets are not fully configured."
