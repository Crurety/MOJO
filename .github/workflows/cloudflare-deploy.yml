name: Cloudflare Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_d1_schema:
        description: Apply D1 schema before deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  deploy:
    name: Deploy To Cloudflare
    runs-on:
      - self-hosted
      - Windows
      - X64
      - mojo-cloudflare
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "9f5aeb4079b42a826ae6756eee6774c8"
      CLOUDFLARE_APPLY_D1_SCHEMA: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_d1_schema && 'true' || 'false' }}
      CLOUDFLARE_DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $repo = "https://x-access-token:${env:GITHUB_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git"

          git config --global --add safe.directory $workspace

          if (Test-Path (Join-Path $workspace '.git')) {
            git -C $workspace remote set-url origin $repo
            git -C $workspace fetch --depth 1 origin $env:GITHUB_SHA
            git -C $workspace reset --hard $env:GITHUB_SHA
            git -C $workspace clean -fdx
          } else {
            Get-ChildItem -Force $workspace | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            git clone --depth 1 $repo $workspace
            git -C $workspace fetch --depth 1 origin $env:GITHUB_SHA
            git -C $workspace checkout --force $env:GITHUB_SHA
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json
            cf-worker/package-lock.json

      - name: Deploy to Cloudflare
        shell: powershell
        run: |
          $bash = 'D:\Software\Git\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            throw "Git Bash not found at $bash"
          }
          & $bash ./scripts/deploy/cloudflare-deploy.sh
