name: Cloudflare Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "18"

jobs:
  deploy:
    name: Deploy To Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "9f5aeb4079b42a826ae6756eee6774c8"
      CLOUDFLARE_APPLY_D1_SCHEMA: "true"
      CLOUDFLARE_DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json
            cf-worker/package-lock.json

      - name: Deploy to Cloudflare
        shell: bash
        run: bash ./scripts/deploy/cloudflare-deploy.sh
